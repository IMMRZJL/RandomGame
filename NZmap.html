<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>新西兰旅行地图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Leaflet 样式 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha512-p6U9H6T6g52MqnhkkpFm4bA1sHqjYv1vUCu5pW0HQXhYX5DdeKkS7Cw7UM48VxgC2xGctLr3qWfWc8gEIr3WQw=="
    crossorigin=""
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 关键：给 map 明确高度 */
    #map {
      width: 100%;
      height: 100%;
    }

    #locateBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 8px 14px;
      border: none;
      border-radius: 18px;
      background: #f5e0a5;
      color: #333;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    #locateBtn:hover {
      background: #f8d374;
    }

    .custom-marker {
      width: 18px;
      height: 18px;
    }
    .custom-marker .marker-diamond {
      width: 14px;
      height: 14px;
      margin: 1px auto;
      transform: rotate(45deg);
      border-radius: 3px;
      background: rgba(0, 172, 255, 0.9);
      border: 2px solid #0085c7;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    .place-label {
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      box-shadow: none;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .popup-title {
      margin: 0 0 6px;
      font-size: 15px;
    }
    .popup-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="locateBtn">定位到我</button>

  <!-- Leaflet 脚本 -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha512-vPSY6H0u5q2dTzTbn6G6SWDuzKxpsuQvkjeEmsXQpgBTpTjjlRzzu+QhHpcZOLTlFZC1VjRcbVQSM4NJC2G0Aw=="
    crossorigin=""
  ></script>

  <script>
    // 等 DOM 都准备好再初始化
    document.addEventListener("DOMContentLoaded", function () {
      var map = L.map("map").setView([-41.5, 172.5], 5.5);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      var diamondIcon = L.divIcon({
        className: "custom-marker",
        html: '<div class="marker-diamond"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -10]
      });

      var places = [
        {
          name: "奥克兰 Auckland",
          lat: -36.8485,
          lng: 174.7633,
          description:
            "奥克兰是大部分人进入新西兰的第一站，海湾和火山并存。白天可以登天空塔俯瞰全城，或者乘渡轮去德文港散步。市中心购物餐厅选择多，适合作为行程起点补给物资。建议安排一到两天，把更多时间留给南岛。"
        },
        {
          name: "霍比屯 Hobbiton",
          lat: -37.8720,
          lng: 175.6820,
          description:
            "霍比屯电影外景地位于玛塔玛塔附近，是魔戒和霍比特人粉丝的必去景点。需要提前在官网预定团，多数从罗托鲁瓦或奥克兰参加一日游。导游会带你参观袋底洞等场景，最后在绿龙酒馆喝一杯特色饮品。"
        },
        {
          name: "罗托鲁瓦 Rotorua",
          lat: -38.1368,
          lng: 176.2497,
          description:
            "罗托鲁瓦以地热和毛利文化闻名，空气里有硫磺味。可以在怀欧塔普、蒂普亚等公园观看喷泉和彩色地热池，晚上参加毛利文化晚宴，体验歌舞和烤全羊。部分温泉可以一边泡一边看湖景，适合缓解旅途疲劳。"
        },
        {
          name: "惠灵顿 Wellington",
          lat: -41.2865,
          lng: 174.7762,
          description:
            "惠灵顿是新西兰首都，城市不大但很有气氛。步行就能逛完海滨、国会大厦和缆车。蒂帕帕国家博物馆免费开放，展品丰富，是雨天好去处。电影爱好者可以去维塔工作室参观特效制作。建议至少住一晚。"
        },
        {
          name: "特卡波湖 Lake Tekapo",
          lat: -44.0049,
          lng: 170.4830,
          description:
            "特卡波湖以梦幻的蓝色湖水和星空出名。善牧堂教堂在湖边，是日落和夜拍的经典机位。春季周边遍布鲁冰花，颜色特别丰富。这里属于暗夜保护区，天气好可以参加观星团，肉眼就能看到银河。"
        },
        {
          name: "库克山 Aoraki / Mt Cook",
          lat: -43.7350,
          lng: 170.0960,
          description:
            "库克山国家公园拥有新西兰最高峰和多条徒步路线。胡克谷步道最受欢迎，往返约三小时，难度不大但风景非常好，可以看到冰川和雪山。夏季注意防晒补水，冬季留意结冰路段，住宿需提前预订。"
        },
        {
          name: "皇后镇 Queenstown",
          lat: -45.0312,
          lng: 168.6626,
          description:
            "皇后镇是户外运动之都，蹦极、跳伞、滑雪等项目丰富。镇中心沿湖一圈就能走完，餐厅酒吧集中，很适合住两到三晚。白天乘缆车上山俯瞰瓦卡蒂普湖，傍晚在湖边看日落。还可以自驾去箭镇或格林诺奇半日游。"
        },
        {
          name: "瓦纳卡 Wanaka",
          lat: -44.6970,
          lng: 169.1339,
          description:
            "瓦纳卡相比皇后镇更安静，适合慢节奏度假。湖边那棵“孤树”是摄影圣地，日出和黄昏光线最好。喜欢徒步可以挑战罗伊峰，登顶视野开阔但爬升较大。也可以选择游船或骑自行车环湖，安排一到两天比较合适。"
        },
        {
          name: "米尔福德峡湾 Milford Sound",
          lat: -44.6167,
          lng: 167.8667,
          description:
            "米尔福德峡湾是南岛最经典景点之一，多数游客从皇后镇或蒂阿瑙参加一日游。乘游船可以近距离观赏瀑布和海豚，阴天反而更有氛围。自驾需走山路，注意油量和时间，冬季可能结冰封路，晕车的人提前准备药。"
        },
        {
          name: "弗朗茨约瑟夫冰川 Franz Josef Glacier",
          lat: -43.3890,
          lng: 170.1810,
          description:
            "弗朗茨约瑟夫冰川位于西海岸，在温带雨林中接近冰川十分特别。步行可到观景平台，想踏上冰面需要参加直升机徒步团。天气多变，活动有被取消的可能，行程上留一点机动天较稳妥。小镇虽小但有超市和餐馆补给。"
        }
      ];

      places.forEach(function (p) {
        var marker = L.marker([p.lat, p.lng], { icon: diamondIcon }).addTo(map);

        marker.bindTooltip(p.name, {
          permanent: true,
          direction: "top",
          offset: [0, -10],
          className: "place-label"
        });

        var popupHtml =
          '<h3 class="popup-title">' + p.name + "</h3>" +
          '<p class="popup-text">' + p.description + "</p>";
        marker.bindPopup(popupHtml);
      });

      var userLayer;

      document.getElementById("locateBtn").addEventListener("click", function () {
        if (!navigator.geolocation) {
          alert("当前浏览器不支持定位功能。");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var accuracy = pos.coords.accuracy;

            if (userLayer) {
              map.removeLayer(userLayer.marker);
              map.removeLayer(userLayer.circle);
            }

            var marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup("你现在大致在这里").openPopup();

            var circle = L.circle([lat, lng], {
              radius: accuracy,
              color: "#3388ff",
              fillColor: "#3388ff",
              fillOpacity: 0.15
            }).addTo(map);

            userLayer = { marker: marker, circle: circle };

            map.setView([lat, lng], 12);
          },
          function (err) {
            alert("定位失败：" + err.message);
          }
        );
      });
    });
  </script>
</body>
</html>
