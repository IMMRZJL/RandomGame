<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Sheikah Slate Map System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* --- 核心基础设置 --- */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #050505;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    /* --- 地图容器与滤镜 --- */
    #map {
      width: 100%;
      height: 100%;
      background: #0b0e12;
      z-index: 1;
    }
    
    /* 配方一：深色科技风格 (保留地形纹理，大幅提亮)
       如果不喜欢这个风格，可以把这里换成之前的“配方二”
    */
    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(160%) contrast(120%) sepia(30%);
    }

    /* --- UI 通用风格 (希卡石板 UI) --- */
    .sheikah-ui {
      background: rgba(10, 10, 12, 0.9);
      border: 1px solid #7d6c47; /* 暗金边框 */
      color: #ffebb3; /* 希卡金文字 */
      backdrop-filter: blur(4px);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0,0,0,0.5);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    /* --- 顶部区域切换器 (New Feature) --- */
    #regionSwitch {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      padding: 5px;
      border-radius: 20px; /* 圆润一点 */
    }
    #regionSwitch button {
      background: transparent;
      border: none;
      color: #7d6c47; /* 未选中时暗淡 */
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 12px;
      transition: all 0.3s;
      border-radius: 15px;
    }
    #regionSwitch button:hover {
      color: #ffebb3;
      text-shadow: 0 0 5px #eecfa1;
    }
    #regionSwitch button.active {
      color: #00d2ff; /* 激活时亮蓝 */
      background: rgba(0, 210, 255, 0.1);
      box-shadow: 0 0 8px #00d2ff inset;
      text-shadow: 0 0 8px #00d2ff;
    }

    /* --- 筛选面板 --- */
    #filterPanel {
      position: absolute;
      top: 80px; /*稍微下移，避开切换器*/
      left: 20px;
      z-index: 1000;
      padding: 15px 20px;
      min-width: 140px;
    }
    #filterPanel h4 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: #eecfa1;
      border-bottom: 1px solid #7d6c47;
      padding-bottom: 5px;
    }
    #filterPanel label {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #dcd0b3;
      transition: color 0.2s;
    }
    #filterPanel label:hover {
      color: #fff;
      text-shadow: 0 0 5px #eecfa1;
    }
    #filterPanel input {
      accent-color: #00d2ff; 
      margin-right: 8px;
    }

    /* --- 定位按钮 --- */
    #locateBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #00d2ff;
      color: #00d2ff;
      box-shadow: 0 0 5px #00d2ff;
      text-shadow: 0 0 2px #00d2ff;
      background: rgba(0, 15, 20, 0.9);
    }
    #locateBtn:hover {
      background: rgba(0, 210, 255, 0.15);
      box-shadow: 0 0 15px #00d2ff;
    }

    /* --- 神庙图标 (Markers) --- */
    .custom-marker {}
    .marker-shrine {
      width: 16px;
      height: 16px;
      margin: 2px auto;
      transform: rotate(45deg);
      background: rgba(0, 210, 255, 0.2);
      border: 2px solid #00d2ff;
      box-shadow: 0 0 8px #00d2ff, inset 0 0 4px #00d2ff;
      transition: transform 0.3s ease;
    }
    .custom-marker:hover .marker-shrine {
      transform: rotate(45deg) scale(1.3);
      background: #00d2ff;
      box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
      cursor: pointer;
    }
    
    /* 橙色神庙（小众景点） */
    .marker-shrine.type-hidden {
      border-color: #ff9900;
      background: rgba(255, 153, 0, 0.2);
      box-shadow: 0 0 8px #ff9900, inset 0 0 4px #ff9900;
    }
    .custom-marker:hover .marker-shrine.type-hidden {
      background: #ff9900;
      box-shadow: 0 0 15px #ff9900, 0 0 30px #ff9900;
    }

    /* --- 地图文字标签 --- */
    .place-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #eecfa1;
      font-size: 13px;
      font-weight: 600;
      text-shadow: 1px 1px 2px #000, 0 0 3px #000;
      padding: 0;
    }
    .leaflet-tooltip-top:before { display: none; }

    /* --- 弹窗 (Popup) --- */
    .leaflet-popup-content-wrapper {
      background: rgba(10, 10, 12, 0.95);
      border: 1px solid #eecfa1;
      border-radius: 4px;
      color: #dcd0b3;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 300px;
    }
    .leaflet-popup-tip { background: #eecfa1; }
    .popup-title {
      color: #00d2ff;
      font-size: 16px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      padding-bottom: 4px;
    }
    .popup-text {
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      text-align: justify;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="regionSwitch" class="sheikah-ui">

    <button id="btn-au" onclick="switchRegion('au')">AUSTRALIA</button>

  </div>

  <button id="locateBtn" class="sheikah-ui">LOCATE</button>

      // ================= 新西兰数据 (NZ - 保持不变) =================

      { region: 'nz', name: "罗托鲁瓦 Rotorua", lat: -38.1368, lng: 176.2497, type: "hot", description: "硫磺味很重的地热城市。除了泡温泉，这里的红木森林徒步也非常棒。" },
      { region: 'nz', name: "惠灵顿 Wellington", lat: -41.2865, lng: 174.7762, type: "hot", description: "风很大的首都。Te Papa博物馆非常震撼，Cuba Street有很多复古小店。" },
      { region: 'nz', name: "基督城 Christchurch", lat: -43.5321, lng: 172.6362, type: "hot", description: "南岛中转站。雅芳河撑船很惬意，纸板教堂见证了震后的重生。" },
      { region: 'nz', name: "特卡波湖 Lake Tekapo", lat: -44.0049, lng: 170.4830, type: "hot", description: "最强观星地。如果不想去天文台人挤人，湖边随便找个黑暗处肉眼看银河也很绝。" },
      { region: 'nz', name: "库克山 Mt Cook", lat: -43.7350, lng: 170.0960, type: "hot", description: "胡克谷步道(Hooker Valley)性价比极高，平路多，终点冰湖景色无敌。" },

      { region: 'nz', name: "阿贝尔塔斯曼 Abel", lat: -41.0333, lng: 173.0167, type: "hidden", description: "南岛北部的金色海岸。这里的皮划艇体验可能是新西兰最好的。" },
      { region: 'nz', name: "凯库拉 Kaikoura", lat: -42.3960, lng: 173.6810, type: "hidden", description: "一边是雪山一边是海。除了观鲸，路边龙虾摊的烤龙虾尾一定要吃。" },
      { region: 'nz', name: "福克斯冰川 Fox", lat: -43.4647, lng: 170.0181, type: "hidden", description: "附近的马瑟森湖(Lake Matheson)清晨无风时，是拍雪山倒影的绝佳机位。" },

      { region: 'au', name: "鹦鹉岛 Cockatoo Is.", lat: -33.8475, lng: 151.1713, type: "hidden", description: "充满工业废墟风的岛屿，以前是监狱和船厂。适合露营和拍酷酷的照片。" },

      { region: 'au', name: "凯马喷水洞 Kiama", lat: -34.6713, lng: 150.8550, type: "hot", description: "悉尼南下的必经小镇。著名的白色灯塔和天然岩石喷水洞，海浪大时水柱很高。" },

      // --- 北领地/南澳 (NT/SA) ---
      { region: 'au', name: "乌鲁鲁 Uluru", lat: -25.3444, lng: 131.0369, type: "hot", description: "澳洲心脏红色巨石。在原野星光展(Field of Light)下看它，会感动得想哭。" },
      { region: 'au', name: "袋鼠岛 Kangaroo Is.", lat: -35.7752, lng: 137.2142, type: "hot", description: "没有围栏的野生动物园。海豹湾可以近距离看海狮，神奇岩石是大自然的鬼斧神工。" }
    ];

    document.addEventListener("DOMContentLoaded", function () {
      // 1. 初始化地图 (注意：这里必须设置 minZoom 否则看澳洲全景会不全)
      map = L.map("map", {
        zoomControl: false, 
        attributionControl: false,
        minZoom: 3 
      }).setView(regions.nz.center, regions.nz.zoom);

      // 2. 加载底图 (Esri Topo + Recipe 1 CSS)
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri"
      }).addTo(map);

      // 3. 渲染地点的函数 (根据 region 和 筛选器 更新)
      function updateMarkers() {
        // 清除现有的所有标记
        placeMarkers.forEach(marker => map.removeLayer(marker));
        placeMarkers = [];

        var showHot = document.getElementById("filterHot").checked;
        var showHidden = document.getElementById("filterHidden").checked;

        // 筛选数据：符合当前国家 + 符合勾选类型
        var filteredPlaces = allPlaces.filter(p => {
          if (p.region !== currentRegion) return false;
          if (p.type === 'hot' && !showHot) return false;
          if (p.type === 'hidden' && !showHidden) return false;
          return true;
        });

        // 重新添加标记
        filteredPlaces.forEach(p => {
          var marker = L.marker([p.lat, p.lng], { 
            icon: createSheikahIcon(p.type) 
          });

          marker.bindTooltip(p.name, {
            permanent: true,
            direction: "right",
            offset: [10, 0],
            className: "place-label"
          });

          var popupHtml = `<h3 class="popup-title">${p.name}</h3><p class="popup-text">${p.description}</p>`;
          marker.bindPopup(popupHtml);

          marker.addTo(map);
          placeMarkers.push(marker);
        });
      }

      // 4. 地图切换逻辑 (Fly Animation)
      window.switchRegion = function(region) {
        if (currentRegion === region) return; // 如果已经是当前区域，不做反应

        currentRegion = region;
        
        // 更新按钮状态
        document.getElementById('btn-nz').className = region === 'nz' ? 'active' : '';
        document.getElementById('btn-au').className = region === 'au' ? 'active' : '';

        // 更新地图点位
        updateMarkers();

        // 执行飞行视角动画
        var target = regions[region];
        map.flyTo(target.center, target.zoom, {
          duration: 2.5, // 飞行时间 2.5秒
          easeLinearity: 0.25
        });
      };

      // 辅助函数：创建图标
      function createSheikahIcon(type) {
        var colorClass = (type === 'hidden') ? 'type-hidden' : ''; 
        return L.divIcon({
          className: "custom-marker",
          html: `<div class="marker-shrine ${colorClass}"></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10],
          popupAnchor: [0, -15],
          tooltipAnchor: [15, 0]
        });
      }

      // 绑定筛选事件
      document.getElementById("filterHot").addEventListener("change", updateMarkers);
      document.getElementById("filterHidden").addEventListener("change", updateMarkers);

      // 绑定定位事件
      var userLayer;
      document.getElementById("locateBtn").addEventListener("click", function () {
        var btn = this;
        btn.innerText = "SCANNING...";
        
        if (!navigator.geolocation) {
          alert("无法获取位置");
          btn.innerText = "LOCATE";
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            btn.innerText = "LINK ESTABLISHED";
            setTimeout(() => btn.innerText = "LOCATE", 2000);

            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var accuracy = pos.coords.accuracy;

            if (userLayer) {
              map.removeLayer(userLayer.marker);
              map.removeLayer(userLayer.circle);
            }

            var userIcon = L.divIcon({
              className: 'custom-marker',
              html: '<div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #fff;filter:drop-shadow(0 0 5px #fff);"></div>',
              iconSize: [16, 16]
            });

            var marker = L.marker([lat, lng], {icon: userIcon}).addTo(map);
            var circle = L.circle([lat, lng], {
              radius: accuracy,
              color: "#00d2ff",
              fillColor: "#00d2ff",
              fillOpacity: 0.1,
              weight: 1,
              dashArray: "5, 5"
            }).addTo(map);

            userLayer = { marker: marker, circle: circle };
            
            // 定位后稍微飞过去
            map.flyTo([lat, lng], 10);
          },
          function (err) {
            alert("定位失败");
            btn.innerText = "LOCATE";
          }
        );
      });

      // 初始运行一次
      updateMarkers();
    });
  </script>
</body>
</html>
