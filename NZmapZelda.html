<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>新西兰 - 希卡石板地图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* --- 核心基础设置 --- */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #050505;
      font-family: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    /* --- 地图容器与滤镜 --- */
    #map {
      width: 100%;
      height: 100%;
      background: #0b0e12;
      z-index: 1;
    }
    
    /* 关键魔法：使用反色滤镜，把白底地形图变成黑底希卡风格 */
    .leaflet-tile-pane {
      /* 1. invert(100%): 把白底变黑底，山脉变深色
         2. hue-rotate(180deg): 修正颜色（因为反色后蓝色海水会变橙色，旋转180度让它变回冷色调）
         3. brightness, contrast, sepia: 调整出那种古老的电子屏质感
      */
      filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(120%) sepia(20%) saturate(150%);
    }

    /* --- UI 通用风格 (希卡石板 UI) --- */
    .sheikah-ui {
      background: rgba(10, 10, 12, 0.9);
      border: 1px solid #7d6c47; /* 暗金边框 */
      color: #ffebb3; /* 希卡金文字 */
      backdrop-filter: blur(4px);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0,0,0,0.5);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- 筛选面板 --- */
    #filterPanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 15px 20px;
      min-width: 140px;
    }
    #filterPanel h4 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: #eecfa1;
      border-bottom: 1px solid #7d6c47;
      padding-bottom: 5px;
    }
    #filterPanel label {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #dcd0b3;
      transition: color 0.2s;
    }
    #filterPanel label:hover {
      color: #fff;
      text-shadow: 0 0 5px #eecfa1;
    }
    #filterPanel input {
      accent-color: #00d2ff; 
      margin-right: 8px;
    }

    /* --- 定位按钮 --- */
    #locateBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      background: rgba(0, 15, 20, 0.9);
      border: 1px solid #00d2ff;
      color: #00d2ff;
      box-shadow: 0 0 5px #00d2ff;
      text-shadow: 0 0 2px #00d2ff;
    }
    #locateBtn:hover {
      background: rgba(0, 210, 255, 0.15);
      box-shadow: 0 0 15px #00d2ff;
    }

    /* --- 神庙图标 (Markers) --- */
    .custom-marker {}
    .marker-shrine {
      width: 16px;
      height: 16px;
      margin: 2px auto;
      transform: rotate(45deg);
      background: rgba(0, 210, 255, 0.2);
      border: 2px solid #00d2ff;
      box-shadow: 0 0 8px #00d2ff, inset 0 0 4px #00d2ff;
      transition: transform 0.3s ease;
    }
    .custom-marker:hover .marker-shrine {
      transform: rotate(45deg) scale(1.3);
      background: #00d2ff;
      box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
      cursor: pointer;
    }
    
    /* 橙色神庙（小众景点） */
    .marker-shrine.type-hidden {
      border-color: #ff9900;
      background: rgba(255, 153, 0, 0.2);
      box-shadow: 0 0 8px #ff9900, inset 0 0 4px #ff9900;
    }
    .custom-marker:hover .marker-shrine.type-hidden {
      background: #ff9900;
      box-shadow: 0 0 15px #ff9900, 0 0 30px #ff9900;
    }

    /* --- 地图文字标签 --- */
    .place-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #eecfa1; /* 希卡金 */
      font-size: 13px;
      font-weight: 600;
      text-shadow: 1px 1px 2px #000, 0 0 3px #000;
      padding: 0;
    }
    .leaflet-tooltip-top:before {
      display: none;
    }

    /* --- 弹窗 (Popup) 样式 --- */
    .leaflet-popup-content-wrapper {
      background: rgba(10, 10, 12, 0.95);
      border: 1px solid #eecfa1;
      border-radius: 4px;
      color: #dcd0b3;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 300px; /* 限制弹窗宽度，防止长文字太宽 */
    }
    .leaflet-popup-tip {
      background: #eecfa1;
    }
    .popup-title {
      color: #00d2ff;
      font-size: 16px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.3);
      padding-bottom: 4px;
    }
    .popup-text {
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      text-align: justify; /* 文字两端对齐，更好看 */
    }

    /* --- 加载动画 --- */
    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.5s ease;
    }
    .sheikah-eye {
      width: 60px;
      height: 60px;
      border: 4px solid #00d2ff;
      border-radius: 50%;
      position: relative;
      animation: pulse 2s infinite;
      box-shadow: 0 0 15px #00d2ff;
    }
    .sheikah-eye::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      background: #00d2ff;
      border-radius: 50%;
    }
    #loading h2 {
      color: #00d2ff;
      font-weight: normal;
      letter-spacing: 3px;
      margin-top: 20px;
      text-shadow: 0 0 10px #00d2ff;
      font-size: 14px;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 5px #00d2ff; opacity: 0.8; }
      50% { box-shadow: 0 0 20px #00d2ff; opacity: 1; }
      100% { box-shadow: 0 0 5px #00d2ff; opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="sheikah-eye"></div>
    <h2>SYSTEM LOADING...</h2>
  </div>

  <div id="map"></div>

  <div id="filterPanel" class="sheikah-ui">
    <h4>MAP FILTERS</h4>
    <label><input type="checkbox" id="filterHot" checked> SHRINES (HOT)</label>
    <label><input type="checkbox" id="filterHidden" checked> TOWERS (HIDDEN)</label>
  </div>

  <button id="locateBtn" class="sheikah-ui">LOCATE</button>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var map = L.map("map", {
        zoomControl: false,
        attributionControl: false
      }).setView([-42.5, 172.5], 6);

      var tileLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Tiles &copy; Esri"
      }).addTo(map);

      var loadingTimeout = setTimeout(hideLoading, 3000);
      tileLayer.on("load", hideLoading);

      function hideLoading() {
        var loading = document.getElementById("loading");
        if (!loading || loading.dataset.done === "1") return;
        loading.dataset.done = "1";
        loading.style.opacity = "0";
        setTimeout(() => loading.style.display = "none", 500);
      }

      function createSheikahIcon(type) {
        var colorClass = (type === 'hidden') ? 'type-hidden' : ''; 
        return L.divIcon({
          className: "custom-marker",
          html: `<div class="marker-shrine ${colorClass}"></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10],
          popupAnchor: [0, -15],
          tooltipAnchor: [15, 0]
        });
      }

      // --- 这里恢复了你原始的完整数据 ---
      var places = [
        // 北岛热门
        {
          name: "奥克兰 Auckland",
          lat: -36.8485,
          lng: 174.7633,
          type: "hot",
          description:
            "奥克兰是大部分人进入新西兰的第一站，海湾和火山并存。白天可以登天空塔俯瞰全城，或者乘渡轮去德文港散步。市中心购物餐厅选择多，适合作为行程起点补给物资。建议安排一到两天，把更多时间留给南岛。"
        },
        {
          name: "霍比屯 Hobbiton",
          lat: -37.8720,
          lng: 175.6820,
          type: "hot",
          description:
            "霍比屯电影外景地位于玛塔玛塔附近，是魔戒和霍比特人粉丝的必去景点。需要提前在官网预定团，多数从罗托鲁瓦或奥克兰参加一日游。导游会带你参观袋底洞等场景，最后在绿龙酒馆喝一杯特色饮品。"
        },
        {
          name: "罗托鲁瓦 Rotorua",
          lat: -38.1368,
          lng: 176.2497,
          type: "hot",
          description:
            "罗托鲁瓦以地热和毛利文化闻名，空气里有硫磺味。可以在怀欧塔普、蒂普亚等公园观看喷泉和彩色地热池，晚上参加毛利文化晚宴，体验歌舞和烤全羊。部分温泉可以一边泡一边看湖景，适合缓解旅途疲劳。"
        },
        {
          name: "惠灵顿 Wellington",
          lat: -41.2865,
          lng: 174.7762,
          type: "hot",
          description:
            "惠灵顿是新西兰首都，城市不大但很有气氛。步行就能逛完海滨、国会大厦和缆车。蒂帕帕国家博物馆免费开放，展品丰富，是雨天好去处。电影爱好者可以去维塔工作室参观特效制作。建议至少住一晚。"
        },

        // 南岛热门
        {
          name: "基督城 Christchurch",
          lat: -43.5321,
          lng: 172.6362,
          type: "hot",
          description:
            "基督城是南岛最大的城市，也是很多人南岛行的起点。市区可以乘坐老式有轨电车，沿雅芳河散步或划小船。震后重建留下不少艺术装置和临时教堂。适合作为抵达当天的缓冲点，补给、买电话卡和调整时差。"
        },
        {
          name: "特卡波湖 Lake Tekapo",
          lat: -44.0049,
          lng: 170.4830,
          type: "hot",
          description:
            "特卡波湖以梦幻的蓝色湖水和星空出名。善牧堂教堂在湖边，是日落和夜拍的经典机位。春季周边遍布鲁冰花，颜色特别丰富。这里属于暗夜保护区，天气好可以参加观星团，肉眼就能看到银河。"
        },
        {
          name: "库克山 Aoraki / Mt Cook",
          lat: -43.7350,
          lng: 170.0960,
          type: "hot",
          description:
            "库克山国家公园拥有新西兰最高峰和多条徒步路线。胡克谷步道最受欢迎，往返约三小时，难度不大但风景非常好，可以看到冰川和雪山。夏季注意防晒补水，冬季留意结冰路段，住宿需提前预订。"
        },
        {
          name: "皇后镇 Queenstown",
          lat: -45.0312,
          lng: 168.6626,
          type: "hot",
          description:
            "皇后镇是户外运动之都，蹦极、跳伞、滑雪等项目丰富。镇中心沿湖一圈就能走完，餐厅酒吧集中，很适合住两到三晚。白天乘缆车上山俯瞰瓦卡蒂普湖，傍晚在湖边看日落。还可以自驾去箭镇或格林诺奇半日游。"
        },
        {
          name: "瓦纳卡 Wanaka",
          lat: -44.6970,
          lng: 169.1339,
          type: "hot",
          description:
            "瓦纳卡相比皇后镇更安静，适合慢节奏度假。湖边那棵“孤树”是摄影圣地，日出和黄昏光线最好。喜欢徒步可以挑战罗伊峰，登顶视野开阔但爬升较大。也可以选择游船或骑自行车环湖，安排一到两天比较合适。"
        },
        {
          name: "米尔福德峡湾 Milford Sound",
          lat: -44.6167,
          lng: 167.8667,
          type: "hot",
          description:
            "米尔福德峡湾是南岛最经典景点之一，多数游客从皇后镇或蒂阿瑙参加一日游。乘游船可以近距离观赏瀑布和海豚，阴天反而更有氛围。自驾需走山路，注意油量和时间，冬季可能结冰封路，晕车的人提前准备药。"
        },
        {
          name: "弗朗茨约瑟夫冰川 Franz Josef Glacier",
          lat: -43.3890,
          lng: 170.1810,
          type: "hot",
          description:
            "弗朗茨约瑟夫冰川位于西海岸，在温带雨林中接近冰川十分特别。步行可到观景平台，想踏上冰面需要参加直升机徒步团。天气多变，活动有被取消的可能，行程上留一点机动天较稳妥。小镇虽小但有超市和餐馆补给。"
        },

        // 南岛小众 / 相对冷门
        {
          name: "阿贝尔塔斯曼 Abel Tasman",
          lat: -41.0333,
          lng: 173.0167,
          type: "hidden",
          description:
            "阿贝尔塔斯曼国家公园位于南岛最北端，以金色沙滩和碧绿海水闻名。常见玩法是乘船到某个海滩再徒步或划皮划艇返回，路线可长可短。这里比皇后镇人少，适合喜欢海边步道和露营的游客，夏季紫外线很强要注意防晒。"
        },
        {
          name: "凯库拉 Kaikoura",
          lat: -42.3960,
          lng: 173.6810,
          type: "hidden",
          description:
            "凯库拉是观鲸和看海豚的热门小镇，但很多第一次南岛自驾的人会错过。海岸线风景非常漂亮，可以在峭壁步道上远眺海豹群。冬春两季观鲸成功率较高，提前预订船票更保险。自驾时注意国道沿海路段偶有落石。"
        },
        {
          name: "福克斯冰川 Fox Glacier",
          lat: -43.4647,
          lng: 170.0181,
          type: "hidden",
          description:
            "福克斯冰川在弗朗茨约瑟夫冰川以南，游客相对更少一些。天气允许时可以参加直升机冰川徒步团，和上一个冰川的体验类似但景观略有不同。附近的马瑟森湖在无风时能拍到倒映南阿尔卑斯山的经典照片，建议清晨前往。"
        },
        {
          name: "蒂阿瑙 Te Anau",
          lat: -45.4145,
          lng: 167.7180,
          type: "hidden",
          description:
            "蒂阿瑙是前往米尔福德峡湾的门户小镇，也是开往峡湾公路的起点。镇子本身很安静，湖边散步就很舒服。天气好的傍晚可以在湖边看日落，夜里还有萤火虫洞可以参观。自驾去峡湾时建议加满油并准备一点零食。"
        },
        {
          name: "但尼丁 Dunedin",
          lat: -45.8788,
          lng: 170.5028,
          type: "hidden",
          description:
            "但尼丁有明显的苏格兰风情，市区有保存良好的火车站和老建筑。附近的奥塔哥半岛是看野生企鹅和信天翁的好地方，黄眼企鹅数量稀少，务必遵守观赏距离和保护规定。这里不算典型旅游路线，适合有多几天时间的旅行者。"
        },
        {
          name: "斯图尔特岛 Stewart Island",
          lat: -46.8990,
          lng: 168.1000,
          type: "hidden",
          description:
            "斯图尔特岛位于南岛以南，需要从布拉夫乘船或小飞机前往。岛上游人不多，步道密布，是远离人群体验原始自然的好去处。夜间有机会在导览带领下看到野生几维鸟。因为天气多变，建议行程上预留机动时间。"
        }
      ];

      var placeMarkers = [];

      places.forEach(function (p) {
        var marker = L.marker([p.lat, p.lng], { 
          icon: createSheikahIcon(p.type) 
        });

        marker._placeType = p.type;

        marker.bindTooltip(p.name, {
          permanent: true,
          direction: "right", 
          offset: [10, 0],
          className: "place-label"
        });

        // 这里我改回了 p.description，并且加上了 text-align: justify 样式让长文字更好看
        var popupHtml = `<h3 class="popup-title">${p.name}</h3><p class="popup-text">${p.description}</p>`;
        marker.bindPopup(popupHtml);

        marker.addTo(map);
        placeMarkers.push(marker);
      });

      function updateFilters() {
        var showHot = document.getElementById("filterHot").checked;
        var showHidden = document.getElementById("filterHidden").checked;

        placeMarkers.forEach(function (marker) {
          var t = marker._placeType;
          var shouldShow = (t === "hot" && showHot) || (t === "hidden" && showHidden);

          if (shouldShow) {
            if (!map.hasLayer(marker)) marker.addTo(map);
          } else {
            if (map.hasLayer(marker)) map.removeLayer(marker);
          }
        });
      }

      document.getElementById("filterHot").addEventListener("change", updateFilters);
      document.getElementById("filterHidden").addEventListener("change", updateFilters);

      var userLayer;
      document.getElementById("locateBtn").addEventListener("click", function () {
        var btn = this;
        btn.innerText = "SCANNING...";
        
        if (!navigator.geolocation) {
          alert("定位模组损坏 (Browser not supported)");
          btn.innerText = "LOCATE";
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            btn.innerText = "LINK ESTABLISHED";
            setTimeout(() => btn.innerText = "LOCATE", 2000);

            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var accuracy = pos.coords.accuracy;

            if (userLayer) {
              map.removeLayer(userLayer.marker);
              map.removeLayer(userLayer.circle);
            }

            var userIcon = L.divIcon({
              className: 'custom-marker',
              html: '<div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #fff;filter:drop-shadow(0 0 5px #fff);"></div>',
              iconSize: [16, 16]
            });

            var marker = L.marker([lat, lng], {icon: userIcon}).addTo(map);
            
            var circle = L.circle([lat, lng], {
              radius: accuracy,
              color: "#00d2ff",
              fillColor: "#00d2ff",
              fillOpacity: 0.1,
              weight: 1,
              dashArray: "5, 5"
            }).addTo(map);

            userLayer = { marker: marker, circle: circle };
            map.setView([lat, lng], 10);
          },
          function (err) {
            alert("信号干扰，无法定位");
            btn.innerText = "LOCATE";
          }
        );
      });
    });
  </script>
</body>
</html>
